name: Feature request
description: Suggest a new tool or capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Publishing and CRM access both exist — gated by `ALLOW_PUBLISH` and
        `ALLOW_CRM`. So the question is not whether a tool is allowed to be
        consequential, but where it lives and what it asks first.

        Permanently out of scope: anything that destroys data HubSpot cannot
        restore, including the GDPR erase endpoint.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: If this reaches the public or touches a record, it belongs in the publishing or CRM module and takes user_confirmed
          required: true
        - label: This does not permanently destroy anything
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task, not the solution. What do you say to the assistant?
      placeholder: |
        I want to ask "swap the hero image on all four regional variants of
        this page" without doing it four times in the UI.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool, if you have one in mind
      description: Name, arguments, what it returns.
    validations:
      required: false
