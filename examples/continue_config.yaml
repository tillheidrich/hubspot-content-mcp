# Continue — ~/.continue/config.yaml
name: my-assistant
version: 0.0.1
schema: v1

mcpServers:
  - name: hubspot-mcp-server
    command: uv
    args:
      - --directory
      - /absolute/path/to/hubspot-mcp-server
      - run
      - hubspot-mcp-server
    env:
      HUBSPOT_MCP_ENV_FILE: /absolute/path/to/hubspot-mcp-server/.env
      ALLOW_PUBLISH: pages,blog
      ALLOW_CRM: none
