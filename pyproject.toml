[project]
name = "hubspot-mcp-server"
version = "0.5.0"
description = "A local MCP server for HubSpot: content, publishing, campaigns and — when you switch it on — CRM. Everything the API offers, gated per area, with no customer data reachable until you say so."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Till Heidrich" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "hubspot",
    "hubspot-cms",
    "cms",
    "marketing",
    "marketing-automation",
    "landing-pages",
    "forms",
    "claude",
    "llm",
    "ai-agent",
    "ai-safety",
    "gdpr",
    "crm",
    "codex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

dependencies = [
    "mcp[cli]>=1.9.4,<2",   # 2.x renamed FastMCP to MCPServer and changed
                           # the API; migrating is tracked separately.
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "openpyxl>=3.1.2",
    "pendulum>=3.0.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/tillheidrich/hubspot-mcp"
Repository = "https://github.com/tillheidrich/hubspot-mcp"
Issues = "https://github.com/tillheidrich/hubspot-mcp/issues"
Changelog = "https://github.com/tillheidrich/hubspot-mcp/blob/main/CHANGELOG.md"

[project.scripts]
hubspot-mcp-server = "hubspot_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubspot_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",
    # UP017 rewrites timezone.utc to datetime.UTC (3.11+). Keeping the
    # 3.10-compatible spelling lets the suite run on older interpreters.
    "UP017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
